<style>
    @page {
        size: 50mm 30mm;
        margin: 0;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0;
        font-family: 'Sarabun', 'TH Sarabun New', Arial, sans-serif;
    }

    .label-container {
        width: 50mm;
        height: 30mm;
        display: flex;
        align-items: center;
        padding: 2mm;
        background: white;
        page-break-after: always;
        box-sizing: border-box;
    }

    /* Last label shouldn't have page break */
    .label-container:last-child {
        page-break-after: auto;
    }

    .qr-section {
        width: 26mm;
        height: 26mm;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .qr-section img {
        width: 26mm;
        height: 26mm;
        image-rendering: crisp-edges;
        image-rendering: pixelated;
    }

    .info-section {
        flex: 1;
        padding-left: 2mm;
        display: flex;
        flex-direction: column;
        justify-content: center;
        line-height: 1.2;
    }

    .brand {
        font-size: 7pt;
        font-weight: bold;
        color: #000;
        margin-bottom: 1mm;
    }

    .asset-id {
        font-size: 5.5pt;
        font-weight: bold;
        color: #000;
        margin-bottom: 1mm;
        line-height: 1.3;
        word-wrap: break-word;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 20mm;
    }

    .asset-name {
        font-size: 5.5pt;
        color: #333;
        margin-bottom: 1mm;
        line-height: 1.3;
        overflow: hidden;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        white-space: normal;
        max-width: 20mm;
        max-height: 7mm;
    }

    .location {
        font-size: 5pt;
        color: #666;
        line-height: 1.3;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 20mm;
    }

    .location-icon {
        font-size: 5.5pt;
    }

    @media print {
        body {
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .label-container {
            page-break-inside: avoid;
        }
    }
</style>

{% for asset in assets %}
<div class="label-container">
    <div class="qr-section">
        <img src="{{ asset.qr_url }}" alt="QR {{ asset.name }}">
    </div>
    <div class="info-section">
        <div class="brand">TUB ASSETS</div>
        <div class="asset-id">{{ asset.name }}</div>
        <div class="asset-name">{% if asset.item_code %}{{ asset.item_code }} | {% endif %}{{ asset.asset_name }}</div>
        <div class="location"><span class="location-icon">📍</span> {{ asset.location }}</div>
    </div>
</div>
{% endfor %}
